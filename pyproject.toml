[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jbo"
version = "0.1.0"
description = "A small transformer trained by REINFORCE on a computable decision task, with linear reads and steering of its posterior and offer-value representations"
requires-python = ">=3.12"
dependencies = [
  "torch==2.12.0",
  "transformer-lens==3.3.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "matplotlib==3.10.9",
  "scikit-learn==1.9.0",
  "transformers==5.16.1",
]

[tool.setuptools]
packages = ["jbo"]
